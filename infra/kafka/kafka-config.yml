# Kafka topics for the Agentic TP Platform (documentation).
#
# Topics are created programmatically by the agent gateway on startup
# (backend/agent-gateway/events.py) — this file is reference only.
#
# Producer: agent-gateway (aiokafka, fire-and-forget)
# Consumer: tp-service (spring-kafka, group agentic-tp-group) → agent_events table
topics:
  - name: agent.interactions        # one event per agent call (explain/hint/quiz/evaluate)
    partitions: 3
    replication-factor: 1
    config:
      retention.ms: 604800000       # 7 days

  - name: progress.updates          # student progress snapshots
    partitions: 3
    replication-factor: 1
    config:
      retention.ms: 604800000       # 7 days

  - name: quiz.completed            # final quiz scores
    partitions: 3
    replication-factor: 1
    config:
      retention.ms: 2592000000      # 30 days

consumer-groups:
  - id: agentic-tp-group
    service: tp-service
    topics:
      - agent.interactions
      - progress.updates
      - quiz.completed

bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
