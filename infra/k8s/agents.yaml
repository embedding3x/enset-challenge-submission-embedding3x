# The four LangGraph agents. All reach Ollama on the host machine through the
# `ollama` Service/Endpoints created by deploy-minikube.sh.
apiVersion: v1
kind: Service
metadata:
  name: explanation-agent
  namespace: agentic-tp
spec:
  selector:
    app: explanation-agent
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explanation-agent
  namespace: agentic-tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: explanation-agent
  template:
    metadata:
      labels:
        app: explanation-agent
    spec:
      containers:
        - name: explanation-agent
          image: agentic/explanation-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: platform-env
          env:
            - name: EXPLANATION_AGENT_PORT
              value: "8001"
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
---
