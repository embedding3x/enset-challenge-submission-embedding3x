apiVersion: v1
kind: Service
metadata:
  name: tp-service
  namespace: agentic-tp
spec:
  selector:
    app: tp-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-service
  namespace: agentic-tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tp-service
  template:
    metadata:
      labels:
        app: tp-service
    spec:
      containers:
        - name: tp-service
          image: agentic/tp-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: platform-env
          env:
            - name: TP_SERVICE_PORT
              value: "8082"
            - name: TP_DB_URL
              value: jdbc:postgresql://postgres:5432/tp_db
            - name: EUREKA_SERVER_URL
              value: http://discovery-server:8761/eureka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /api/tp/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
