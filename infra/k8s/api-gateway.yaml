# LoadBalancer so `minikube tunnel` exposes it on localhost:8080
# (the frontend build points the browser at http://localhost:8080).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agentic-tp
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: agentic-tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: agentic/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: platform-env
          env:
            - name: API_GATEWAY_PORT
              value: "8080"
            - name: AUTH_SERVICE_PORT
              value: "8081"
            - name: TP_SERVICE_PORT
              value: "8082"
            - name: AGENT_GATEWAY_PORT
              value: "8000"
            - name: EUREKA_SERVER_URL
              value: http://discovery-server:8761/eureka
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
