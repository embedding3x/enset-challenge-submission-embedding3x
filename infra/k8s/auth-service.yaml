apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: agentic-tp
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: agentic-tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: agentic/auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: platform-env
          env:
            - name: AUTH_SERVICE_PORT
              value: "8081"
            - name: AUTH_DB_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: EUREKA_SERVER_URL
              value: http://discovery-server:8761/eureka
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
