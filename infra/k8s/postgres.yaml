apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: agentic-tp
data:
  init-multi-db.sh: |
    #!/bin/bash
    # Creates auth_db, tp_db and rag_db automatically when postgres starts.
    # rag_db gets the pgvector extension enabled for the RAG pipeline.
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE auth_db;
        CREATE DATABASE tp_db;
        CREATE DATABASE rag_db;
        GRANT ALL PRIVILEGES ON DATABASE auth_db TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE tp_db TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE rag_db TO $POSTGRES_USER;
    EOSQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname rag_db <<-EOSQL
        CREATE EXTENSION IF NOT EXISTS vector;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentic-tp
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentic-tp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-env
                  key: AUTH_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-env
                  key: AUTH_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
